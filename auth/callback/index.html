<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>The Translators' Guild has moved</title>
<script>
/* The Guild has moved to translators-guild-web.vercel.app. This page is
   all that is left at the old address: it reads the progress this browser
   kept here and hands it over in the link as #carry=<base64 JSON>, which
   the new site merges in. Email sign-in links go straight through. */
(function () {
  var NEW = "https://translators-guild-web.vercel.app";
  // Never forward to ourselves, should this page ever be served there.
  if (location.hostname === "translators-guild-web.vercel.app") return;
  var path = location.pathname.replace(/\/+$/, "");
  if (path === "/auth/callback" || path === "/auth/callback/index.html") {
    location.replace(NEW + "/auth/callback" + location.search + location.hash);
    return;
  }
  var carry = "";
  try {
    var raw = localStorage.getItem("nafithat-al-mutarjim-v1");
    var s = raw ? JSON.parse(raw) : null;
    if (s && typeof s === "object") {
      var d = {}, any = false;
      if (s.marks && typeof s.marks === "object" && Object.keys(s.marks).length) { d.marks = s.marks; any = true; }
      if (typeof s.seenRank === "string" && s.seenRank) { d.seenRank = s.seenRank; any = true; }
      if (s.finale) { d.finale = true; any = true; }
      if (s.terms && typeof s.terms === "object" && Object.keys(s.terms).length) { d.terms = s.terms; any = true; }
      if (s.work && typeof s.work === "object" && Object.keys(s.work).length &&
          JSON.stringify(s.work).length < 20000) { d.work = s.work; any = true; }
      if (any) carry = btoa(unescape(encodeURIComponent(JSON.stringify(d))));
    }
  } catch (e) { carry = ""; }
  location.replace(NEW + "/" + (carry ? "#carry=" + carry : ""));
})();
</script>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #110620; color: #fff; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 0 16px; box-sizing: border-box;
    font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: #fff; }
</style>
</head>
<body>
<p>The Guild has moved to <a href="https://translators-guild-web.vercel.app/">translators-guild-web.vercel.app</a></p>
<noscript><p>Follow the link above to continue.</p></noscript>
</body>
</html>
